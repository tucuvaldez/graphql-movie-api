
services:
  mongodb:
    image: mongo:6.0
    container_name: graphql-movie-mongodb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - graphql-network

  api:
    build: .
    container_name: graphql-movie-api
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      # Inside the Docker network, Mongo's host is the service name, not
      # localhost -- this overrides the MONGODB_URI from .env (which is
      # meant for running the API with `npm run dev` outside Docker).
      MONGODB_URI: mongodb://admin:password@mongodb:27017/movies?authSource=admin
    depends_on:
      - mongodb
    networks:
      - graphql-network
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongodb_data:

networks:
  graphql-network:
    driver: bridge
